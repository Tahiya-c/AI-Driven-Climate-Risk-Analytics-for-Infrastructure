<text text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#52606D"><tspan x="1210" y="500.0">Hyperparameters tuned on PileA hold-out years 2057–2070</tspan></text>
