<text text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1F2933"><tspan x="990" y="235.5">Add Thermal Dose</tspan><tspan x="990" y="254.5">(Age × Water Factor)</tspan></text>
