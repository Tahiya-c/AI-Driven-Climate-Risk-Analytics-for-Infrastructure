<text text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1F2933"><tspan x="330" y="235.5">Fix Column</tspan><tspan x="330" y="254.5">Names (D9)</tspan></text>
